<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cash Note</title>
  <link rel="manifest" href="/manifest.json">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">

    <header class="header">
      <h1 class="header-title">Trackaver<span style="color:var(--accent-blue)">.io</span></h1>
      <div class="header-user">
        <div class="header-user-info">
          <span class="header-greeting">Halo, <strong>User</strong></span>
          <span class="header-date">Bulan Ini</span>
        </div>
        <div class="header-avatar" role="img" aria-label="Avatar Pengguna" aria-hidden="true">👤</div>
      </div>
    </header>

    <main>

      <!--TRACKER SUMMARY-->
      <section class="summary" aria-labelledby="summary-heading">
        <h2 id="summary-heading" class="visually-hidden">Ringkasan Keuangan</h2>
        
        
        <div class="summary-balance">
          <h3 class="summary-label balance-label">Saldo Saat Ini</h3>
          <p>
            Rp.
            <span id="balance-amount" class="summary-balance-amount"></span>
          </p>
        </div>

        <div class="summary-stat">
          <h3 class="summary-label">Pemasukan</h3>
          <p>
            Rp.
             <span id="balance-amount-income" class="summary-stat-amount summary-stat-amount--income">Rp</span>
          </p>
        </div>

        <div class="summary-stat">
          <h3 class="summary-label">Pengeluaran</h3>
          <p>
            Rp.
            <span id="balance-amount-expense" class="summary-stat-amount summary-stat-amount--expense">Rp</span>
          </p>
        </div>
      </section>

      <!--TRACKER FORM-->
      <section class="form-section" aria-labelledby="form-heading">
        <div class="form-section-card">
          <h2 id="form-heading" class="form-section-heading">Tambah Pencatatan Baru</h2>

          <form id="transactionForm" class="form">
            <!--Input Keterangan transaksi  -->
            <div class="form-field">
              <label class="form-label" for="transactionFormTitleInput">Keterangan</label>
              <input type="text" id="transactionFormTitleInput" class="form-input" placeholder="Misal: Makan siang...">
            </div>
            <!--Input jumlah(Rp) transaksi  -->
            <div class="form-field">
              <label class="form-label" for="transactionFormAmountInput">Nominal (Rp)</label>
              <input type="number" id="transactionFormAmountInput" class="form-input" placeholder="50000">
            </div>
            <!--Input tanggal transaksi  -->
            <div class="form-field">
              <label class="form-label" for="transactionFormDateInput">Tanggal</label>
              <input type="date" id="transactionFormDateInput" class="form-input">
            </div>
            <!--Input jenis transaksi  -->
            <div class="form-field">
              <label class="form-label" for="transactionFormTypeSelect">Klasifikasi</label>
              <select id="transactionFormTypeSelect" class="form-input">
                <option value="income">Uang Masuk (+)</option>
                <option value="expense">Uang Keluar (-)</option>
              </select>
            </div>
            <!--Buton submit-->
            <button type="submit" class="form-submit">Simpan</button>
          </form>
        </div>
      </section>

      <!--TRACKER HISTORY-->
      <section class="history" aria-labelledby="history-heading">
        <h2 id="history-heading" class="visually-hidden">Riwayat Transaksi</h2>

        <div class="search">
          <form id="searchTransactionForm" class="search-form" role="search">
            <input type="search" id="searchTransactionFormTitleInput" class="form-input" placeholder="Cari transaksi berdasarkan judul..." aria-label="Kata kunci pencarian transaksi">
            <button type="submit" class="search-submit" aria-label="Mulai Pencarian">Cari</button>
          </form>
        </div>

        <div class="history-grid">
          <div class="transaction-list">
            <div class="transaction-list-header">
              <h3 class="transaction-list-title">Arus Pemasukan</h3>
            </div>
            
            <div id="incomeList" class="transaction-list-container">
              <!-- ... -->
            </div>
          </div>

          <div class="transaction-list">
            <div class="transaction-list-header">
              <h3 class="transaction-list-title">Arus Pengeluaran</h3>
            </div>
            <div id="expenseList" class="transaction-list-container">
              <!-- ... -->
            </div>
          </div>
        </div>
      </section>

    </main>

    <footer class="footer">
      <p>&#169; 2026 Trackaver.io</p>
    </footer>

  </div>

  <script src="main.js"></script>
</body>
</html>
